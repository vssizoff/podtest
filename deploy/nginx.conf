limit_req_zone $binary_remote_addr zone=auth:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
log_format no_query '$remote_addr $request_method $uri $status $request_time';
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout no_query;
    root /usr/share/nginx/html;
    include /etc/nginx/resolver.inc;
    include /etc/nginx/dev.d/*.conf;
    client_max_body_size 65m;
    client_body_timeout 30s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location /api/v1/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/proxy.inc;
    }
    location /auth/ {
        limit_req zone=auth burst=12 nodelay;
        include /etc/nginx/proxy.inc;
    }
    location ~ ^/(internal|metrics|debug|admin|healthz)(/|$) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
